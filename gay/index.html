    <div class="container">
        <!-- LOADING -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
        </div>

        <!-- BACKGROUND VIDEO -->
        <video id="bgVideo" autoplay muted loop playsinline preload="metadata" onerror="console.log('Video error, continuing without video');">
            <source src="video.mp4" type="video/mp4">
        </video>

        <!-- COVER PAGE -->
        <div class="cover-page" id="coverPage">
            <div class="heart">💕</div>
            <h1>Our Story</h1>
            <p class="intro">
            A collection of moments that made us us.<br>
                Every page, every memory, every heartbeat together.
            </p>
            <button class="open-btn" onclick="openBook()">Click Me!</button>
        </div>

        <!-- BOOK CONTAINER -->
        <div class="book-container" id="bookContainer">
            <div class="book-spine"></div>
            <div class="pages" id="pages"></div>
        </div>

        <!-- LEFT BUTTON -->
        <button class="nav-button" id="prevBtn" onclick="previousPage()">❮</button>

        <!-- RIGHT BUTTON -->
        <button class="nav-button" id="nextBtn" onclick="nextPage()">❯</button>

        <!-- PAGE COUNTER - OUTSIDE BELOW BOOK -->
        <span class="page-counter">
            <span id="currentPage">1</span> / <span id="totalPages">1</span>
        </span>

        <!-- MUSIC CONTROL - OUTSIDE BOOK -->
        <div class="music-control">
            <button class="music-button" id="musicBtn" onclick="toggleMusic()" title="Toggle Music">
                🎵
            </button>
        </div>
    </div>

    <!-- IMAGE MODAL - OUTSIDE CONTAINER -->
    <div id="imageModal" class="image-modal" onclick="closeImageModal(event)">
        <div class="modal-content">
            <span class="modal-close" onclick="closeImageModal()">&times;</span>
            <img id="modalImage" src="" alt="">
            <p id="modalCaption"></p>
        </div>
    </div>

    <audio id="bgMusic" preload="auto" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
